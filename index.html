<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NO COIN RUNNER</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#06102a;color:#eaf6ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;
background:radial-gradient(ellipse at 50% 85%,rgba(40,255,150,.28),transparent 60%),radial-gradient(ellipse at 50% 0,#10285e,#06102a 70%);overflow:auto}
.scr.on{display:flex}.ov{background:rgba(6,16,42,.82)}
h1{font:900 clamp(34px,11vw,64px)/.95 Impact,'Arial Black',sans-serif;text-align:center;margin:0;letter-spacing:1px;text-shadow:0 0 18px #2dff9a,0 0 48px rgba(45,255,154,.55)}
h1 span{color:#2dff9a}
.sub{opacity:.7;text-align:center;max-width:320px;font-size:14px;margin:0 0 8px}
button,input,select{font:inherit;border-radius:14px;border:1px solid #2a4a7a;background:#0d1f45;color:#eaf6ff;padding:13px 16px}
button{cursor:pointer;font-weight:700}.btn{width:min(320px,86vw)}
.pri{background:#2dff9a;color:#04210f;border-color:#2dff9a;font-size:22px;letter-spacing:2px;box-shadow:0 0 24px rgba(45,255,154,.5)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(380px,92vw)}
.card{background:#0b1a3a;border:1px solid #1f3a6a;border-radius:16px;padding:14px;width:min(380px,92vw)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #16305e;font-size:15px}
.li b{color:#2dff9a}.top{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;display:flex;gap:6px}
.top button{padding:7px 12px;font-size:13px}
#hud{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));font:900 clamp(36px,10vw,54px) Impact,sans-serif;
background:rgba(0,0,0,.55);padding:2px 14px;border-radius:12px;display:none;text-shadow:0 0 10px #2dff9a;font-variant-numeric:tabular-nums}
#fps{position:fixed;right:10px;bottom:6px;font:12px monospace;color:#2dff9a;display:none}
#msg{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:#2dff9a;color:#04210f;padding:8px 16px;border-radius:20px;font-weight:800;display:none;z-index:9}
.err{color:#ff7a8a;font-size:13px;min-height:16px;text-align:center}
</style></head><body>
<canvas id="c"></canvas><div id="hud">0.00</div><div id="fps"></div><div id="msg"></div>

<div class="scr on" id="menu"><div class="top"><button id="lang"></button><button id="acc"></button></div>
<h1>NO COIN<br><span>RUNNER</span></h1><p class="sub" id="tag"></p>
<div class="card" style="text-align:center">🏆 <span id="best">0.00</span> · <span id="pts"></span></div>
<button class="btn pri" id="bPlay"></button>
<button class="btn" id="bRank"></button><button class="btn" id="bShop"></button><button class="btn" id="bCode"></button></div>

<div class="scr ov" id="rank"><h1 style="font-size:32px" id="tRank"></h1><div class="card" id="rlist" style="max-height:68vh;overflow:auto"></div><button class="btn" data-go="menu" id="bk1"></button></div>
<div class="scr ov" id="shop"><h1 style="font-size:32px" id="tShop"></h1><div class="row"><button id="tabC"></button><button id="tabK"></button></div>
<div class="card" id="slist" style="max-height:58vh;overflow:auto"></div><button class="btn" data-go="menu" id="bk2"></button></div>
<div class="scr ov" id="codes"><h1 style="font-size:32px" id="tCode"></h1><input class="btn" id="cin" autocapitalize="characters" autocomplete="off"><button class="btn pri" id="cuse" style="font-size:18px"></button><div class="err" id="cerr"></div><button class="btn" data-go="menu" id="bk3"></button></div>
<div class="scr ov" id="auth"><h1 style="font-size:30px" id="tAuth"></h1>
<input class="btn" id="aemail" type="email" autocomplete="email"><input class="btn" id="apass" type="password" autocomplete="current-password">
<input class="btn" id="anick" maxlength="16"><select class="btn" id="acty"></select><div class="err" id="aerr"></div>
<button class="btn pri" id="aok" style="font-size:18px"></button><button class="btn" id="asw"></button><button class="btn" id="aout"></button><button class="btn" data-go="menu" id="bk4"></button></div>
<div class="scr ov" id="end"><h1 style="font-size:54px" id="etime"></h1><p class="sub" id="einfo"></p><button class="btn pri" id="bAgain"></button><button class="btn" data-go="menu" id="bk5"></button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=i=>document.getElementById(i),T=THREE;
/* ---------- i18n ---------- */
const I={pt:{tag:'O cronômetro só para quando você pega uma moeda. Desvie delas.',play:'JOGAR',rank:'RANKING',shop:'LOJA',code:'CÓDIGOS',back:'Voltar',top:'TOP 100 GLOBAL',chars:'Personagens',capes:'Capas',
 use:'Usar',own:'Em uso',equip:'Equipar',buy:'Comprar',none:'Sem capa',cplace:'Digite um código',cuse:'Usar código',login:'Entrar',reg:'Criar conta',nologin:'Já tenho conta',noacc:'Criar conta nova',out:'Sair da conta',
 email:'E-mail',pass:'Senha',nick:'Nickname',acc:'Conta',guest:'Entrar',pts:'pontos',again:'Jogar de novo',coin:'Você tocou em uma moeda!',crash:'Você bateu num obstáculo!',newbest:'NOVO RECORDE!',best:'Recorde',
 empty:'Ninguém no ranking ainda.',needlogin:'Entre na sua conta para isso.',ok:'Código resgatado!',errs:{email:'E-mail inválido',pass:'Senha: mínimo 6 caracteres',nick:'Nick: 3–16 letras, números, _ . -',nick_taken:'Nickname já existe',email_taken:'E-mail já cadastrado',login:'E-mail ou senha incorretos',invalid:'Código inválido',used:'Código já usado',buy:'Pontos insuficientes',rate:'Muitas tentativas'},egg:'Easter egg! +'},
en:{tag:'The timer only stops when you grab a coin. Dodge them.',play:'PLAY',rank:'RANKING',shop:'SHOP',code:'CODES',back:'Back',top:'GLOBAL TOP 100',chars:'Characters',capes:'Capes',
 use:'Use',own:'Equipped',equip:'Equip',buy:'Buy',none:'No cape',cplace:'Enter a code',cuse:'Redeem code',login:'Log in',reg:'Sign up',nologin:'I have an account',noacc:'Create new account',out:'Log out',
 email:'Email',pass:'Password',nick:'Nickname',acc:'Account',guest:'Log in',pts:'points',again:'Play again',coin:'You touched a coin!',crash:'You hit an obstacle!',newbest:'NEW RECORD!',best:'Best',
 empty:'Nobody on the board yet.',needlogin:'Log in to do that.',ok:'Code redeemed!',errs:{email:'Invalid email',pass:'Password: 6+ characters',nick:'Nick: 3–16 letters, numbers, _ . -',nick_taken:'Nickname taken',email_taken:'Email already used',login:'Wrong email or password',invalid:'Invalid code',used:'Code already used',buy:'Not enough points',rate:'Too many attempts'},egg:'Easter egg! +'}};
let lang=localStorage.ncr_lang||((navigator.language||'').startsWith('pt')?'pt':'en');
const t=k=>I[lang][k];
/* ---------- estado / API ---------- */
let user=null,token=localStorage.ncr_tok||'',localBest=+localStorage.ncr_best||0,tab='c',mode='login';
const SK={gold:{n:'Ouro',c:0xe8b800,h:0xffcc00},ruby:{n:'Rubi',c:0xd62828,h:0xffcc00},forest:{n:'Floresta',c:0x2e9e4f,h:0x9cff6a},neon:{n:'Neon',c:0x18e0ff,h:0xff3df2}};
const CP={cape_red:{n:'Capa Vermelha',c:0xd62828},cape_purple:{n:'Capa Roxa',c:0x7c4dff},cape_gold:{n:'Capa Dourada',c:0xffc400}};
const PR={gold:0,ruby:200,forest:400,neon:800,cape_red:300,cape_purple:600,cape_gold:1500};
const CT={BR:'Brasil',PT:'Portugal',AO:'Angola',MZ:'Moçambique',US:'USA',AR:'Argentina',MX:'México',ES:'España',FR:'France',DE:'Deutschland',GB:'UK',JP:'日本',CA:'Canada',CL:'Chile',CO:'Colombia',IT:'Italia'};
const flag=c=>String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt()));
async function api(p,b,m){const r=await fetch('/api/'+p,{method:b||m==='POST'?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:b?JSON.stringify(b):undefined});
 const j=await r.json().catch(()=>({e:'net'}));if(!r.ok)throw j;return j}
const fmt=s=>{s=+s||0;const m=Math.floor(s/60),x=(s-m*60).toFixed(2);return m?m+':'+x.padStart(5,'0'):x};
function toast(s){const m=$('msg');m.textContent=s;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',2200)}
const go=id=>{document.querySelectorAll('.scr').forEach(e=>e.classList.remove('on'));$(id).classList.add('on');if(id==='rank')loadRank();if(id==='shop')drawShop();if(id==='menu')ui();if(id==='auth')drawAuth()};
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
/* ---------- UI ---------- */
function ui(){const L=I[lang];$('tag').textContent=L.tag;$('bPlay').textContent=L.play;$('bRank').textContent='🏆 '+L.rank;$('bShop').textContent='🛍 '+L.shop;$('bCode').textContent='🔑 '+L.code;
 ['bk1','bk2','bk3','bk4','bk5'].forEach(i=>$(i).textContent='← '+L.back);$('tRank').textContent=L.top;$('tShop').textContent=L.shop;$('tCode').textContent=L.code;
 $('tabC').textContent=L.chars;$('tabK').textContent=L.capes;$('cin').placeholder=L.cplace;$('cuse').textContent=L.cuse;$('bAgain').textContent=L.again;$('lang').textContent=lang.toUpperCase();
 $('acc').textContent=user?'👤 '+user.nick:'👤 '+L.guest;$('best').textContent=fmt(Math.max(localBest,user?user.best:0));$('pts').textContent=(user?user.pts:0)+' '+L.pts}
function drawAuth(){const L=I[lang];$('aerr').textContent='';const li=!!user,reg=mode==='reg'&&!li;
 $('tAuth').textContent=li?user.nick:(reg?L.reg:L.login);['aemail','apass','anick','acty','aok','asw'].forEach(i=>$(i).style.display=li?'none':'');
 $('anick').style.display=reg?'':'none';$('acty').style.display=reg?'':'none';$('aout').style.display=li?'':'none';$('aout').textContent=L.out;
 $('aemail').placeholder=L.email;$('apass').placeholder=L.pass;$('anick').placeholder=L.nick;$('aok').textContent=reg?L.reg:L.login;$('asw').textContent=reg?L.nologin:L.noacc}
$('acty').innerHTML=Object.entries(CT).map(([k,v])=>`<option value="${k}">${flag(k)} ${v}</option>`).join('');
$('asw').onclick=()=>{mode=mode==='reg'?'login':'reg';drawAuth()};
$('aok').onclick=async()=>{try{const reg=mode==='reg',r=await api(reg?'register':'login',{email:$('aemail').value,password:$('apass').value,nick:$('anick').value,country:$('acty').value});
 token=r.token;localStorage.ncr_tok=token;user=r.user;sync();go('menu')}catch(e){$('aerr').textContent=I[lang].errs[e.e]||e.e||'Erro'}};
$('aout').onclick=()=>{token='';localStorage.removeItem('ncr_tok');user=null;go('menu')};
$('acc').onclick=()=>go('auth');$('lang').onclick=()=>{lang=lang==='pt'?'en':'pt';localStorage.ncr_lang=lang;ui()};
function sync(){ui();rebuildPlayer()}
async function loadRank(){const el=$('rlist');el.textContent='…';try{const a=await api('top');el.innerHTML='';if(!a.length)el.textContent=t('empty');
 a.forEach((p,i)=>{const d=document.createElement('div');d.className='li';const l=document.createElement('span');l.textContent=(i<3?['🥇','🥈','🥉'][i]:(i+1)+'.')+' '+flag(p.country||'BR')+' '+p.nick;const b=document.createElement('b');b.textContent=fmt(p.best);d.append(l,b);el.append(d)})}catch{el.textContent='offline'}}
function drawShop(){const L=I[lang],el=$('slist');el.innerHTML='';$('tabC').style.background=tab==='c'?'#2dff9a':'';$('tabC').style.color=tab==='c'?'#04210f':'';$('tabK').style.background=tab==='k'?'#2dff9a':'';$('tabK').style.color=tab==='k'?'#04210f':'';
 if(!user){el.textContent=L.needlogin;return}
 const src=tab==='c'?SK:CP;if(tab==='k'){const n=document.createElement('div');n.className='li';n.innerHTML='<span>'+L.none+'</span>';const b=document.createElement('button');b.textContent=user.cape?L.use:L.own;b.onclick=async()=>{user=(await api('unequip-cape',{})).user;rebuildPlayer();drawShop()};n.append(b);el.append(n)}
 for(const k in src){const own=user.owned.includes(k),eq=user.skin===k||user.cape===k,d=document.createElement('div');d.className='li';d.innerHTML=`<span>${src[k].n} <b>${own?'':PR[k]+' '+L.pts}</b></span>`;
  const b=document.createElement('button');b.textContent=eq?L.own:own?L.equip:L.buy;b.disabled=eq;b.onclick=async()=>{try{user=(await api(own?'equip':'buy',{item:k})).user;rebuildPlayer();drawShop();ui()}catch(e){toast(L.errs[e.e]||'Erro')}};d.append(b);el.append(d)}}
$('tabC').onclick=()=>{tab='c';drawShop()};$('tabK').onclick=()=>{tab='k';drawShop()};
$('bRank').onclick=()=>go('rank');$('bShop').onclick=()=>go('shop');$('bCode').onclick=()=>go('codes');
$('cuse').onclick=async()=>{if(!user){$('cerr').textContent=t('needlogin');return}try{user=(await api('code',{code:$('cin').value})).user;$('cerr').textContent='';toast(t('ok'));$('cin').value='';rebuildPlayer();ui()}catch(e){$('cerr').textContent=t('errs')[e.e]||'Erro'}};

/* ---------- 3D ---------- */
const LW=2.4,cv=$('c'),R=new T.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new T.Scene();S.background=new T.Color(0x0a2a2e);S.fog=new T.Fog(0x0a2a2e,35,125);
const cam=new T.PerspectiveCamera(65,1,.1,300);
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=innerWidth<innerHeight?78:62;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
S.add(new T.HemisphereLight(0xbfffe0,0x0a2a1c,.95));const sun=new T.DirectionalLight(0xffffff,.55);sun.position.set(-5,12,6);S.add(sun);
const mat=(c,o)=>new T.MeshLambertMaterial(Object.assign({color:c,flatShading:true},o||{}));
const box=(w,h,d,c,x,y,z,p)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);(p||S).add(m);return m};
box(500,.1,500,0x123d2b,0,-.1,-150);box(LW*3+.4,.1,400,0x2a4a40,0,0,-150);
[-1,1].forEach(s=>{box(.35,.3,400,0x7c4dff,s*(LW*1.5+.35),.1,-150);box(.08,.03,400,0xffffff,s*LW*.5,.07,-150);box(.08,.03,400,0xffffff,s*LW*1.5,.07,-150)});
const moon=new T.Mesh(new T.SphereGeometry(4,16,12),new T.MeshBasicMaterial({color:0xeaf4ff,fog:false}));moon.position.set(-38,28,-110);moon.userData.egg='moon';S.add(moon);
const stars=[];for(let i=0;i<70;i++){const m=new T.Mesh(new T.BoxGeometry(.3,.3,.3),new T.MeshBasicMaterial({color:i%3?0x2dff9a:0x9affd6}));m.position.set((Math.random()-.5)*90,Math.random()*30+1,-Math.random()*130);S.add(m);stars.push(m)}
const trees=[];function mkTree(pink){const g=new T.Group();box(.5,2.2,.5,0x5a3a2a,0,1.1,0,g);const c=pink?0xff6fd8:[0x1fcf6a,0x2ee6c0,0x17a38a][Math.random()*3|0];
 [[0,3.3,0,1.7],[.6,2.6,.2,1.1],[-.6,2.8,-.2,1.2]].forEach(a=>{const m=new T.Mesh(new T.IcosahedronGeometry(a[3],0),mat(c));m.position.set(a[0],a[1],a[2]);g.add(m)});return g}
for(let i=0;i<30;i++){const g=mkTree(false),s=i%2?1:-1;g.position.set(s*(7+Math.random()*10),0,-i*6.5);g.scale.setScalar(.8+Math.random()*.9);S.add(g);trees.push(g)}
const pinkTree=mkTree(true);pinkTree.userData.egg='pinktree';pinkTree.position.set(-6.5,0,-60);pinkTree.scale.setScalar(1.3);S.add(pinkTree);pinkTree.traverse(o=>o.userData.egg='pinktree');
for(let i=0;i<8;i++){const z=-i*26-8;[-1,1].forEach(s=>{box(.2,5,.2,0x222a30,s*5.6,2.5,z);box(1.4,.15,.15,0x222a30,s*5,5,z)})}
let player,px=0,py=0,vy=0,lane=0;
function rebuildPlayer(){if(player)S.remove(player);const sk=SK[user?user.skin:'gold']||SK.gold,cp=user&&CP[user.cape];player=new T.Group();
 box(.9,1,.55,sk.c,0,1.5,0,player);box(.6,.6,.6,0xffd6a8,0,2.3,0,player);box(.18,.35,.55,sk.h,0,2.75,0,player);box(.25,.85,.3,0x222233,-.2,.45,0,player);box(.25,.85,.3,0x222233,.2,.45,0,player);box(.2,.7,.25,sk.c,-.58,1.5,0,player);box(.2,.7,.25,sk.c,.58,1.5,0,player);
 if(cp)box(.85,1.1,.08,cp.c,0,1.45,.34,player);S.add(player);player.position.x=px}
rebuildPlayer();
/* ---------- partida ---------- */
let objs=[],run=false,t0=0,tt=0,speed=15,spawnD=0,runId=null,last=0,reason='';
function row(z){const free=Math.random()*3|0;for(let l=0;l<3;l++){if(l===free&&Math.random()<.7)continue;const x=(l-1)*LW,r=Math.random();
  if(r<.34){const g=new T.Group();for(let i=0;i<5;i++)box(.5,.9,.3,i%2?0xffffff:0xd62828,-1+i*.5,.45,0,g);g.position.set(x,0,z);g.userData={k:'bar',x};S.add(g);objs.push(g)}
  else if(r<.5){const g=new T.Group();box(2,3,9,[0x6a4cff,0x1fb5a0,0xe0b020][Math.random()*3|0],0,1.6,0,g);box(2.05,.4,9.05,0xffffff,0,2.2,0,g);g.position.set(x,0,z);g.userData={k:'train',x};S.add(g);objs.push(g)}
  else if(l!==free||r>.8){for(let i=0;i<5;i++){const c=new T.Mesh(new T.CylinderGeometry(.5,.5,.12,14),new T.MeshLambertMaterial({color:0xffc400,emissive:0x664400}));c.rotation.x=Math.PI/2;c.position.set(x,1,z-i*2.2);c.userData={k:'coin',x};S.add(c);objs.push(c)}}}}
function start(){objs.forEach(o=>S.remove(o));objs=[];px=0;lane=0;py=0;vy=0;speed=15;spawnD=24;tt=0;run=true;for(let z=-30;z>=-130;z-=24)row(z);reason='';runId=null;
 if(user)api('run/start',{}).then(r=>runId=r.runId).catch(()=>{});
 document.querySelectorAll('.scr').forEach(e=>e.classList.remove('on'));$('hud').style.display='block';t0=performance.now();last=t0}
async function endRun(why){if(!run)return;run=false;reason=why;$('hud').style.display='none';const time=tt;let nb=false;
 if(time>localBest){localBest=time;localStorage.ncr_best=time;nb=true}
 if(user&&runId){try{const r=await api('run/finish',{runId,time});user=r.user;nb=r.improved}catch{}}
 $('etime').textContent=fmt(time)+' s';$('einfo').textContent=(why==='coin'?t('coin'):t('crash'))+(nb?'  🏆 '+t('newbest'):'')+'  ·  '+t('best')+' '+fmt(Math.max(localBest,user?user.best:0));
 go('end');$('end').classList.add('on');$('menu').classList.remove('on');ui()}
$('bPlay').onclick=start;$('bAgain').onclick=start;
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;
 if(run){tt=(now-t0)/1000;speed=Math.min(15+tt*.18,32);$('hud').textContent=fmt(tt);
  px+=(lane*LW-px)*Math.min(1,dt*14);vy-=38*dt;py+=vy*dt;if(py<=0){py=0;vy=0}
  spawnD-=speed*dt;while(spawnD<=0){row(-130);spawnD+=24}
  for(let i=objs.length-1;i>=0;i--){const o=objs[i];o.position.z+=speed*dt;if(o.position.z>12){S.remove(o);objs.splice(i,1);continue}
   const z=o.position.z,k=o.userData.k,dx=Math.abs(o.userData.x-px);
   if(k==='coin'){o.rotation.z+=dt*4;if(Math.abs(z)<.8&&dx<1&&py<1.5){endRun('coin');break}}
   else if(k==='bar'){if(Math.abs(z)<.5&&dx<1.2&&py<.9){endRun('obs');break}}
   else if(Math.abs(z)<4.6&&dx<1.1&&py<3){endRun('obs');break}}}
 const m=speed*dt*(run?1:.35);trees.forEach(g=>{g.position.z+=m;if(g.position.z>8)g.position.z-=195});pinkTree.position.z+=m;if(pinkTree.position.z>8)pinkTree.position.z-=330;
 stars.forEach(s=>{s.position.y+=Math.sin(now/700+s.position.x)*.004});
 player.position.set(px,py,0);player.rotation.z=(lane*LW-px)*-.08;
 const leg=run?Math.sin(now/70)*.4:0;player.children[3].rotation.x=leg;player.children[4].rotation.x=-leg;
 cam.position.set(px*.6,3.8+py*.25,6.8);cam.lookAt(px*.6,1.4,-7);R.render(S,cam);
 frame.n=(frame.n||0)+1;if(now-(frame.f||0)>1000){if($('fps').style.display==='block')$('fps').textContent=frame.n+' FPS';frame.n=0;frame.f=now}}
requestAnimationFrame(frame);$('fps').style.display='block';
/* ---------- controles + easter eggs ---------- */
const mv=d=>{if(run)lane=Math.max(-1,Math.min(1,lane+d))},jump=()=>{if(run&&py<=.01)vy=14};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')mv(-1);else if(k==='arrowright'||k==='d')mv(1);else if(k==='arrowup'||k==='w'||k===' ')jump();else if(k==='arrowdown'||k==='s')vy=Math.min(vy,-18);else if(k==='enter'&&!run&&$('menu').classList.contains('on'))start()});
let sx=0,sy=0,st=0;const ray=new T.Raycaster();
cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;st=performance.now();
 if(run&&user){ray.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},cam);const h=ray.intersectObjects([moon,pinkTree],true)[0];if(h){const id=h.object.userData.egg;
  api('egg',{id}).then(r=>{user=r.user;toast(t('egg')+r.gain);ui()}).catch(()=>{})}}});
cv.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)<22)return;if(Math.abs(dx)>Math.abs(dy))mv(dx>0?1:-1);else if(dy<0)jump();else vy=Math.min(vy,-18)});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
/* ---------- init ---------- */
if(token)api('me').then(r=>{user=r.user;ui();rebuildPlayer()}).catch(()=>{token='';localStorage.removeItem('ncr_tok')});
ui();
</script></body></html>
